services:
  ai_agent:
    build:
      context: ./ai_agent
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      - PORT=8000
      - OLLAMA_VOICE_URL=http://gemma-voice:11434
      - OLLAMA_VOICE_MODEL=gemma3:4b
      - OLLAMA_ATTENTION_URL=http://gemma-attention:11434
      - OLLAMA_ATTENTION_MODEL=gemma3:4b
      - OLLAMA_EMOTION_URL=http://gemma-emotion:11434
      - OLLAMA_EMOTION_MODEL=gemma3:1b
      - OLLAMA_LOGIC_URL=http://gemma-logic:11434
      - OLLAMA_LOGIC_MODEL=gemma3:1b
      - OLLAMA_KNOWLEDGE_URL=http://gemma-knowledge:11434
      - OLLAMA_KNOWLEDGE_MODEL=gemma3:1b
      - OLLAMA_WISDOM_URL=http://gemma-wisdom:11434
      - OLLAMA_WISDOM_MODEL=gemma3:4b
      - DB_HOST=elsiebrain_db
      - DB_NAME=${DB_NAME}
      - DB_USER=${DB_USER}
      - DB_PASSWORD=${DB_PASSWORD}
      - DB_PORT=5432  # Internal port remains 5432
    volumes:
      - ./ai_agent:/app
    networks:
      - elsie_network
      - elsie_models
      
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/"]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped

  discord_bot:
    build:
      context: ./discord_bot
      dockerfile: Dockerfile
    env_file:
      - .env
    environment:
      - DISCORD_TOKEN=${DISCORD_TOKEN}
      - AI_AGENT_URL=http://ai_agent:8000
    volumes:
      - ./discord_bot:/app
    networks:
      - elsie_network
    depends_on:
      ai_agent:
        condition: service_healthy
    restart: unless-stopped

  db_populator:
    build:
      context: ./db_populator
      dockerfile: Dockerfile
    container_name: elsiebrain_populator
    env_file:
      - .env
    environment:
      - DB_HOST=elsiebrain_db
      - DB_NAME=${DB_NAME}
      - DB_USER=${DB_USER}
      - DB_PASSWORD=${DB_PASSWORD}
      - DB_PORT=5432  # Internal port remains 5432
      - WIKI_UPDATE_INTERVAL=3600  # Update every hour
    networks:
      - elsie_network
      

volumes:
  elsiebrain_data:
    driver: local

networks:
  elsie_network:
    driver: bridge
  elsie_models:
    external: true
    name: elsie_models 