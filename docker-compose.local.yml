version: '3.8'

services:
  ai_agent:
    build:
      context: ./ai_agent
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      - PORT=8000
      - OLLAMA_VOICE_URL=http://host.docker.internal:11434
      - OLLAMA_ATTENTION_URL=http://host.docker.internal:11435
      - OLLAMA_EMOTION_URL=http://host.docker.internal:11436
      - OLLAMA_LOGIC_URL=http://host.docker.internal:11437
      - OLLAMA_KNOWLEDGE_URL=http://host.docker.internal:11438
      - OLLAMA_WISDOM_URL=http://host.docker.internal:11439
    networks:
      - elsie_network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  discord_bot:
    build:
      context: ./discord_bot
      dockerfile: Dockerfile
    environment:
      - DISCORD_TOKEN=${DISCORD_TOKEN:-your_discord_token_here}
      - AI_AGENT_URL=http://ai_agent:8000
    networks:
      - elsie_network
    depends_on:
      ai_agent:
        condition: service_healthy

networks:
  elsie_network:
    driver: bridge 